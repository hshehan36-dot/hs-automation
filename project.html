<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Project Details</title>

<style>

body{
background:#071426;
font-family:Segoe UI;
color:white;
margin:0;
padding:0;
}

.container{
max-width:1200px;
margin:auto;
padding:50px;
}

h1{
color:#00d4ff;
font-size:48px;
margin-bottom:20px;
}

.project-image{
width:100%;
max-height:500px;
object-fit:cover;
border-radius:20px;
margin-bottom:30px;
}

.card{
background:#10233d;
padding:30px;
border-radius:20px;
margin-top:20px;
}

.label{
color:#00d4ff;
font-size:22px;
margin-bottom:10px;
}

.back-btn{
display:inline-block;
background:#00d4ff;
color:black;
padding:12px 25px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
margin-top:30px;
}

</style>

</head>

<body>

<div class="container">

<h1 id="projectTitle">Loading...</h1>

<img
id="projectImage"
class="project-image"
src=""
alt="Project Image">

<div class="card">

<div class="label">
Technology
</div>

<p id="projectTechnology"></p>

</div>

<div class="card">

<div class="label">
Description
</div>

<p id="projectDescription"></p>

</div>

<a
href="index.html#projects"
class="back-btn">
← Back To Projects
</a>

</div>

<script>

<script>

const params =
new URLSearchParams(
window.location.search
);

const selectedProject =
params.get("project");

async function loadProject(){

const response =
await fetch(
"https://opensheet.elk.sh/15nUhkv9EJ-7zbNL9y45y2REb2Acr3azwUspUyAlVaSY/Sheet1"
);

const data =
await response.json();

const project =
data.find(
p =>
p.ProjectName.trim().toLowerCase() ===
selectedProject.trim().toLowerCase()
);

if(project){

document.getElementById(
"projectTitle"
).innerText =
project.ProjectName;

document.getElementById(
"projectImage"
).src =
project.ImageURL;

document.getElementById(
"projectTechnology"
).innerText =
project.Technology;

document.getElementById(
"projectDescription"
).innerText =
project.Description;

}

}

loadProject();

</script>
