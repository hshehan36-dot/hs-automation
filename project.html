<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Details</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
background:#071426;
font-family:'Segoe UI',sans-serif;
color:white;
line-height:1.6;
}

.container{
max-width:980px;
margin:auto;
padding:48px 24px 70px;
}

.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:12px;
margin-bottom:28px;
}

.back-btn{
display:inline-flex;
align-items:center;
gap:8px;
background:#00d4ff;
color:#071426;
padding:10px 20px;
border-radius:10px;
text-decoration:none;
font-weight:700;
font-size:14px;
transition:.2s;
}

.back-btn:hover{
transform:translateY(-2px);
box-shadow:0 8px 18px rgba(0,212,255,.3);
}

.copy-btn{
background:#10233d;
color:#00d4ff;
border:1px solid rgba(0,212,255,.4);
padding:10px 16px;
border-radius:10px;
font-weight:600;
font-size:14px;
cursor:pointer;
transition:.2s;
}

.copy-btn:hover{
background:rgba(0,212,255,.15);
}

.hero-card{
background:linear-gradient(135deg,#0f2442 0%,#13315c 100%);
border:1px solid rgba(0,212,255,.3);
border-radius:22px;
padding:36px;
margin-bottom:24px;
box-shadow:0 14px 34px rgba(0,0,0,.35);
}

.tech-pill{
display:inline-block;
background:rgba(0,212,255,.14);
color:#00d4ff;
border:1px solid rgba(0,212,255,.38);
padding:6px 14px;
border-radius:999px;
font-size:13px;
font-weight:600;
margin-bottom:14px;
}

h1{
color:white;
font-size:40px;
line-height:1.2;
}

.card{
background:#10233d;
border:1px solid rgba(255,255,255,.06);
padding:28px;
border-radius:18px;
margin-top:20px;
}

.label{
color:#00d4ff;
font-size:18px;
font-weight:700;
margin-bottom:12px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:10px;
}

.toggle-btn{
background:rgba(255,255,255,.07);
color:#cbd5e1;
border:1px solid rgba(255,255,255,.15);
padding:5px 12px;
border-radius:8px;
font-size:12px;
cursor:pointer;
}

.toggle-btn:hover{
color:white;
border-color:#00d4ff;
}

#projectOverview{
white-space:pre-line;
line-height:1.85;
color:#e2e8f0;
font-size:16px;
}

#projectOverview.compact{
line-height:1.5;
font-size:15px;
}

.meta-row{
color:#94a3b8;
font-size:14px;
margin-top:10px;
}

@media(max-width:640px){
h1{
font-size:28px;
}
.hero-card, .card{
padding:22px;
}
}
</style>
</head>

<body>

<div class="container">
    <div class="top-bar">
        <a href="index.html#projects" class="back-btn">← Back To Projects</a>
        <button type="button" class="copy-btn" id="copyLinkBtn" onclick="copyShareLink()">Share / Copy Link</button>
    </div>

    <div class="hero-card">
        <span class="tech-pill" id="projectTechnology">Loading...</span>
        <h1 id="projectTitle">Loading Project...</h1>
        <p class="meta-row" id="projectMeta">HS Automation Solutions • Case Study</p>
    </div>

    <div class="card">
        <div class="label">
            <span>Project Overview</span>
            <button type="button" class="toggle-btn" onclick="toggleLineSpacing()">Adjust Reading Spacing</button>
        </div>
        <p id="projectOverview">Fetching project details...</p>
    </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const selectedProject = (params.get("project") || "").trim();

async function loadProject() {
    const titleEl = document.getElementById("projectTitle");
    const techEl = document.getElementById("projectTechnology");
    const overviewEl = document.getElementById("projectOverview");

    if (!selectedProject) {
        titleEl.innerText = "Project Not Specified";
        techEl.innerText = "Info";
        overviewEl.innerText = "Please select a project from the Projects section to view its details.";
        return;
    }

    try {
        const response = await fetch(
            "https://opensheet.elk.sh/15nUhkv9EJ-7zbNL9y45y2REb2Acr3azwUspUyAlVaSY/Sheet1"
        );
        const data = await response.json();

        const project = data.find(
            p => (p.ProjectName || "").trim().toLowerCase() === selectedProject.toLowerCase()
        );

        if (project) {
            document.title = `${project.ProjectName} | HS Automation Solutions`;
            titleEl.innerText = project.ProjectName;
            techEl.innerText = project.Technology || "Automation";
            overviewEl.innerText = (project["Project Overview"] || "").trim() || "No project overview available yet.";
        } else {
            titleEl.innerText = "Project Not Found";
            techEl.innerText = "Not Found";
            overviewEl.innerText = `Could not find details for "${selectedProject}".`;
        }
    } catch (err) {
        titleEl.innerText = "Error Loading Project";
        techEl.innerText = "Error";
        overviewEl.innerText = "Unable to load project details right now. Please try again later.";
        console.error(err);
    }
}

function toggleLineSpacing() {
    document.getElementById("projectOverview").classList.toggle("compact");
}

function copyShareLink() {
    navigator.clipboard.writeText(window.location.href).then(() => {
        const btn = document.getElementById("copyLinkBtn");
        const original = btn.innerText;
        btn.innerText = "Link Copied ✓";
        setTimeout(() => { btn.innerText = original; }, 1800);
    });
}

loadProject();
</script>

</body>
</html>
