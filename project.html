<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Details</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
background:#071426;
font-family:'Segoe UI',sans-serif;
color:white;
line-height:1.6;
}

.container{
max-width:1000px;
margin:auto;
padding:44px 22px 75px;
}

.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:12px;
margin-bottom:24px;
}

.back-btn{
display:inline-flex;
align-items:center;
gap:8px;
background:#00d4ff;
color:#071426;
padding:10px 20px;
border-radius:10px;
text-decoration:none;
font-weight:700;
font-size:14px;
transition:.2s;
}

.back-btn:hover{
transform:translateY(-2px);
box-shadow:0 8px 18px rgba(0,212,255,.3);
}

.live-btn{
display:inline-flex;
align-items:center;
gap:8px;
background:#00d4ff;
color:#071426;
padding:11px 22px;
border-radius:10px;
text-decoration:none;
font-weight:700;
font-size:14px;
margin-top:16px;
transition:.2s;
}

.live-btn:hover{
transform:translateY(-2px);
box-shadow:0 8px 18px rgba(0,212,255,.3);
}

.copy-btn{
background:#10233d;
color:#00d4ff;
border:1px solid rgba(0,212,255,.4);
padding:10px 16px;
border-radius:10px;
font-weight:600;
font-size:14px;
cursor:pointer;
transition:.2s;
}

.copy-btn:hover{
background:rgba(0,212,255,.15);
}

.hero-card{
background:linear-gradient(135deg,#0f2442 0%,#13315c 100%);
border:1px solid rgba(0,212,255,.3);
border-radius:22px;
padding:34px;
margin-bottom:22px;
box-shadow:0 14px 34px rgba(0,0,0,.35);
}

.badge-row{
display:flex;
align-items:center;
gap:10px;
flex-wrap:wrap;
margin-bottom:14px;
}

.tech-pill{
display:inline-block;
background:rgba(0,212,255,.14);
color:#00d4ff;
border:1px solid rgba(0,212,255,.38);
padding:6px 14px;
border-radius:999px;
font-size:13px;
font-weight:600;
}

.featured-pill{
display:inline-flex;
align-items:center;
gap:5px;
background:rgba(250, 204, 21, .16);
color:#fde047;
border:1px solid rgba(250, 204, 21, .45);
padding:6px 14px;
border-radius:999px;
font-size:12px;
font-weight:700;
}

h1{
color:white;
font-size:38px;
line-height:1.2;
}

.meta-row{
color:#94a3b8;
font-size:14px;
margin-top:10px;
}

/* Project Slideshow (Max 5 Images) */
.gallery-card{
background:#10233d;
border:1px solid rgba(0,212,255,.22);
border-radius:20px;
overflow:hidden;
margin-top:20px;
box-shadow:0 14px 32px rgba(0,0,0,.35);
}

.gallery-stage{
position:relative;
width:100%;
height:450px;
background:#08162a;
overflow:hidden;
}

.gallery-stage img{
width:100%;
height:100%;
object-fit:contain;
background:#08162a;
transition:opacity .35s ease;
}

.gallery-stage img.fade{
opacity:.3;
}

.gallery-counter{
position:absolute;
top:14px;
right:14px;
background:rgba(7,20,38,.85);
border:1px solid rgba(255,255,255,.16);
color:#e2e8f0;
padding:5px 12px;
border-radius:999px;
font-size:12px;
font-weight:700;
}

.gallery-nav{
position:absolute;
top:50%;
transform:translateY(-50%);
width:42px;
height:42px;
border-radius:50%;
border:1px solid rgba(0,212,255,.45);
background:rgba(7,20,38,.82);
color:#00d4ff;
font-size:22px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
transition:.2s;
}

.gallery-nav:hover{
background:#00d4ff;
color:#071426;
}

.gallery-nav.prev{left:14px;}
.gallery-nav.next{right:14px;}

.gallery-controls{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:12px;
padding:14px 20px;
background:#0b192e;
border-top:1px solid rgba(255,255,255,.06);
}

.thumbs{
display:flex;
gap:10px;
flex-wrap:wrap;
align-items:center;
}

.thumb-btn{
width:68px;
height:44px;
border-radius:8px;
overflow:hidden;
border:2px solid transparent;
background:#071426;
cursor:pointer;
padding:0;
opacity:.6;
transition:.2s;
}

.thumb-btn img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.thumb-btn.active{
border-color:#00d4ff;
opacity:1;
transform:translateY(-2px);
}

.auto-toggle-btn{
background:rgba(0,212,255,.12);
color:#00d4ff;
border:1px solid rgba(0,212,255,.35);
padding:7px 14px;
border-radius:8px;
font-size:12px;
font-weight:600;
cursor:pointer;
}

.auto-toggle-btn:hover{
background:rgba(0,212,255,.22);
}

/* Case Study Blocks */
.card{
background:#10233d;
border:1px solid rgba(255,255,255,.06);
padding:28px;
border-radius:18px;
margin-top:20px;
}

.two-col-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(290px,1fr));
gap:20px;
margin-top:20px;
}

.two-col-grid .card{
margin-top:0;
}

.label{
color:#00d4ff;
font-size:18px;
font-weight:700;
margin-bottom:14px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:10px;
}

.toggle-btn{
background:rgba(255,255,255,.07);
color:#cbd5e1;
border:1px solid rgba(255,255,255,.15);
padding:5px 12px;
border-radius:8px;
font-size:12px;
cursor:pointer;
}

.toggle-btn:hover{
color:white;
border-color:#00d4ff;
}

#projectOverview{
white-space:pre-line;
line-height:1.85;
color:#e2e8f0;
font-size:16px;
}

#projectOverview.compact{
line-height:1.5;
font-size:15px;
}

.feature-list{
list-style:none;
display:grid;
gap:10px;
color:#e2e8f0;
font-size:15px;
}

.feature-list li{
padding-left:22px;
position:relative;
line-height:1.65;
}

.feature-list li::before{
content:"▹";
position:absolute;
left:0;
color:#00d4ff;
font-weight:bold;
}

.block-text{
color:#cbd5e1;
font-size:15px;
line-height:1.75;
white-space:pre-line;
}

.arch-tags{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:14px;
}

.arch-tag{
background:rgba(0,212,255,.1);
color:#7dd3fc;
border:1px solid rgba(0,212,255,.28);
padding:5px 12px;
border-radius:999px;
font-size:12px;
font-weight:600;
}

/* Prev / Next Project Navigation */
.project-nav-bar{
margin-top:26px;
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
}

.proj-nav-card{
background:#0f233e;
border:1px solid rgba(0,212,255,.22);
border-radius:16px;
padding:18px 20px;
text-decoration:none;
color:white;
display:flex;
flex-direction:column;
gap:6px;
transition:.22s;
}

.proj-nav-card:hover{
border-color:#00d4ff;
transform:translateY(-3px);
box-shadow:0 12px 24px rgba(0,0,0,.35);
}

.proj-nav-card.next-card{
text-align:right;
align-items:flex-end;
}

.proj-nav-dir{
font-size:12px;
font-weight:700;
color:#00d4ff;
text-transform:uppercase;
letter-spacing:.05em;
}

.proj-nav-title{
font-size:16px;
font-weight:700;
color:#f1f5f9;
}

.proj-nav-placeholder{
background:#0b182b;
border:1px dashed rgba(255,255,255,.1);
border-radius:16px;
padding:18px 20px;
color:#64748b;
font-size:14px;
display:flex;
align-items:center;
}

.proj-nav-placeholder.next-card{
justify-content:flex-end;
}

@media(max-width:640px){
h1{
font-size:28px;
}
.hero-card, .card{
padding:22px;
}
.gallery-stage{
height:260px;
}
.thumb-btn{
width:52px;
height:36px;
}
.project-nav-bar{
grid-template-columns:1fr;
}
.proj-nav-card.next-card{
text-align:left;
align-items:flex-start;
}
}
</style>
</head>

<body>

<div class="container">
    <div class="top-bar">
        <a href="index.html#projects" class="back-btn">← Back To Projects</a>
        <button type="button" class="copy-btn" id="copyLinkBtn" onclick="copyShareLink()">Share / Copy Link</button>
    </div>

    <div class="hero-card">
        <div class="badge-row">
            <span class="tech-pill" id="projectTechnology">Loading...</span>
            <span class="featured-pill" id="projectFeaturedBadge" style="display:none;">⭐ Featured Project</span>
        </div>
        <h1 id="projectTitle">Loading Project...</h1>
        <p class="meta-row" id="projectMeta">HS Automation Solutions • Case Study</p>
        <a id="projectLiveUrl" class="live-btn" href="#" target="_blank" rel="noopener" style="display:none;">Open Live Solution ↗</a>
    </div>

    <!-- Project Slideshow (Max 5 Images) -->
    <div class="gallery-card" id="galleryCard" style="display:none;">
        <div class="gallery-stage" id="galleryStage">
            <img id="galleryImg" src="" alt="Project Screenshot">
            <span class="gallery-counter" id="galleryCounter">1 / 1</span>
            <button type="button" class="gallery-nav prev" onclick="prevGallerySlide()" aria-label="Previous image">‹</button>
            <button type="button" class="gallery-nav next" onclick="nextGallerySlide()" aria-label="Next image">›</button>
        </div>
        <div class="gallery-controls">
            <div class="thumbs" id="galleryThumbs"></div>
            <button type="button" class="auto-toggle-btn" id="autoPlayBtn" onclick="toggleAutoPlay()">Auto Slide: ON</button>
        </div>
    </div>

    <!-- Overview Block -->
    <div class="card">
        <div class="label">
            <span>Project Overview</span>
            <button type="button" class="toggle-btn" onclick="toggleLineSpacing()">Adjust Reading Spacing</button>
        </div>
        <p id="projectOverview">Fetching project details...</p>
    </div>

    <!-- Key Features Block -->
    <div class="card" id="keyFeaturesCard" style="display:none;">
        <div class="label">
            <span>Key Features & Highlights</span>
        </div>
        <ul class="feature-list" id="keyFeaturesList"></ul>
    </div>

    <!-- Business Impact & Architecture Grid -->
    <div class="two-col-grid">
        <div class="card" id="businessImpactCard">
            <div class="label">
                <span>Business Impact / Outcome</span>
            </div>
            <p class="block-text" id="businessImpactText"></p>
        </div>

        <div class="card" id="architectureCard">
            <div class="label">
                <span>Architecture / Tools Used</span>
            </div>
            <p class="block-text" id="architectureText"></p>
            <div class="arch-tags" id="archTags"></div>
        </div>
    </div>

    <!-- Previous / Next Project Navigation -->
    <div class="project-nav-bar" id="projectNavBar" style="display:none;">
        <div id="prevProjectSlot"></div>
        <div id="nextProjectSlot"></div>
    </div>
</div>

<script>
const SHEET_API = "https://opensheet.elk.sh/15nUhkv9EJ-7zbNL9y45y2REb2Acr3azwUspUyAlVaSY/Sheet1";
const params = new URLSearchParams(window.location.search);
const selectedProject = (params.get("project") || "").trim();

let projectImages = [];
let galleryIndex = 0;
let galleryTimer = null;
let isAutoPlaying = true;

function escapeHtml(str = "") {
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

function isFeaturedProject(project) {
    const val = String(project.Featured || project.featured || "").trim().toLowerCase();
    return ["yes", "true", "1", "featured", "pin", "pinned"].includes(val);
}

function extractProjectImages(project) {
    const urls = [];

    if (project.ImageURL) {
        String(project.ImageURL)
            .split(/[\n,]+/)
            .map(u => u.trim())
            .filter(Boolean)
            .forEach(u => urls.push(u));
    }

    ["ImageURL2", "ImageURL3", "ImageURL4", "ImageURL5", "Image1", "Image2", "Image3", "Image4", "Image5"].forEach(col => {
        if (project[col] && String(project[col]).trim()) {
            urls.push(String(project[col]).trim());
        }
    });

    return [...new Set(urls)].slice(0, 5);
}

function parseKeyFeatures(project, overview) {
    const raw = (project.KeyFeatures || project["Key Features"] || "").trim();
    if (raw) {
        return raw
            .split(/[\n•·]+/)
            .map(item => item.replace(/^[-*]\s*/, "").trim())
            .filter(Boolean);
    }

    // Fallback: extract key feature sentences/lines from overview if KeyFeatures column is empty
    const lines = String(overview || "")
        .split(/\n+/)
        .map(l => l.trim())
        .filter(Boolean);

    if (lines.length > 1) {
        return lines.slice(1, 5).map(l => l.replace(/^[-*•]\s*/, ""));
    }

    const sentences = String(overview || "")
        .split(/(?<=[.!?])\s+/)
        .map(s => s.trim())
        .filter(s => s.length > 12);

    return sentences.slice(0, 3);
}

function buildBusinessImpact(project, overview) {
    const explicit = (project.BusinessImpact || project["Business Impact"] || "").trim();
    if (explicit) return explicit;

    const lines = String(overview || "")
        .split(/\n+/)
        .map(l => l.trim())
        .filter(Boolean);

    if (lines.length >= 2) {
        return lines[lines.length - 1];
    }

    return "Streamlines manual workflows, improves data visibility and accuracy, and supports faster operational decision-making.";
}

function buildArchitectureInfo(project) {
    const explicit = (project.Architecture || "").trim();
    const techRaw = (project.Technology || "Automation").trim();
    const tools = techRaw
        .split(/[,/|]+/)
        .map(t => t.trim())
        .filter(Boolean);

    const description = explicit ||
        `Built using ${tools.join(", ")} to connect data sources, automate business logic, and deliver an intuitive user experience.`;

    return { description, tools };
}

function renderCaseStudySections(project, overview) {
    // 1. Key Features
    const features = parseKeyFeatures(project, overview);
    const featuresCard = document.getElementById("keyFeaturesCard");
    const featuresList = document.getElementById("keyFeaturesList");

    if (features.length > 0) {
        featuresList.innerHTML = features.map(f => `<li>${escapeHtml(f)}</li>`).join("");
        featuresCard.style.display = "block";
    } else {
        featuresCard.style.display = "none";
    }

    // 2. Business Impact / Outcome
    document.getElementById("businessImpactText").innerText = buildBusinessImpact(project, overview);

    // 3. Architecture / Tools Used
    const arch = buildArchitectureInfo(project);
    document.getElementById("architectureText").innerText = arch.description;
    document.getElementById("archTags").innerHTML = arch.tools
        .map(tool => `<span class="arch-tag">${escapeHtml(tool)}</span>`)
        .join("");
}

function renderPrevNextNav(projects, currentIdx) {
    const navBar = document.getElementById("projectNavBar");
    const prevSlot = document.getElementById("prevProjectSlot");
    const nextSlot = document.getElementById("nextProjectSlot");

    if (!projects.length || currentIdx === -1) {
        navBar.style.display = "none";
        return;
    }

    navBar.style.display = "grid";

    if (currentIdx > 0) {
        const prevProj = projects[currentIdx - 1];
        const prevName = (prevProj.ProjectName || "Previous Project").trim();
        prevSlot.innerHTML = `
        <a href="project.html?project=${encodeURIComponent(prevName)}" class="proj-nav-card">
            <span class="proj-nav-dir">← Previous Project</span>
            <span class="proj-nav-title">${escapeHtml(prevName)}</span>
        </a>`;
    } else {
        prevSlot.innerHTML = `<div class="proj-nav-placeholder">You are viewing the first project</div>`;
    }

    if (currentIdx < projects.length - 1) {
        const nextProj = projects[currentIdx + 1];
        const nextName = (nextProj.ProjectName || "Next Project").trim();
        nextSlot.innerHTML = `
        <a href="project.html?project=${encodeURIComponent(nextName)}" class="proj-nav-card next-card">
            <span class="proj-nav-dir">Next Project →</span>
            <span class="proj-nav-title">${escapeHtml(nextName)}</span>
        </a>`;
    } else {
        nextSlot.innerHTML = `<div class="proj-nav-placeholder next-card">You are viewing the latest project</div>`;
    }
}

/* Slideshow */
function renderGallery(images, title) {
    projectImages = images;
    const galleryCard = document.getElementById("galleryCard");

    if (!projectImages.length) {
        galleryCard.style.display = "none";
        return;
    }

    galleryCard.style.display = "block";
    const thumbsEl = document.getElementById("galleryThumbs");
    thumbsEl.innerHTML = "";

    projectImages.forEach((url, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "thumb-btn" + (idx === 0 ? " active" : "");
        btn.setAttribute("aria-label", `View image ${idx + 1}`);
        btn.innerHTML = `<img src="${url}" alt="${escapeHtml(title)} preview ${idx + 1}">`;
        btn.onclick = () => showGallerySlide(idx);
        thumbsEl.appendChild(btn);
    });

    const showNav = projectImages.length > 1;
    document.querySelector(".gallery-nav.prev").style.display = showNav ? "flex" : "none";
    document.querySelector(".gallery-nav.next").style.display = showNav ? "flex" : "none";
    document.getElementById("autoPlayBtn").style.display = showNav ? "inline-block" : "none";

    showGallerySlide(0);
    startGalleryTimer();
}

function showGallerySlide(idx) {
    if (!projectImages.length) return;
    galleryIndex = (idx + projectImages.length) % projectImages.length;

    const imgEl = document.getElementById("galleryImg");
    imgEl.classList.add("fade");
    setTimeout(() => {
        imgEl.src = projectImages[galleryIndex];
        document.getElementById("galleryCounter").innerText = `${galleryIndex + 1} / ${projectImages.length}`;
        imgEl.classList.remove("fade");
    }, 120);

    document.querySelectorAll(".thumb-btn").forEach((btn, i) => {
        btn.classList.toggle("active", i === galleryIndex);
    });

    if (isAutoPlaying) startGalleryTimer();
}

function nextGallerySlide() {
    showGallerySlide(galleryIndex + 1);
}

function prevGallerySlide() {
    showGallerySlide(galleryIndex - 1);
}

function startGalleryTimer() {
    clearInterval(galleryTimer);
    if (isAutoPlaying && projectImages.length > 1) {
        galleryTimer = setInterval(nextGallerySlide, 3500);
    }
}

function toggleAutoPlay() {
    isAutoPlaying = !isAutoPlaying;
    document.getElementById("autoPlayBtn").innerText = `Auto Slide: ${isAutoPlaying ? "ON" : "OFF"}`;
    if (isAutoPlaying) {
        startGalleryTimer();
    } else {
        clearInterval(galleryTimer);
    }
}

const galleryStage = document.getElementById("galleryStage");
galleryStage.addEventListener("mouseenter", () => clearInterval(galleryTimer));
galleryStage.addEventListener("mouseleave", () => {
    if (isAutoPlaying) startGalleryTimer();
});

async function loadProject() {
    const titleEl = document.getElementById("projectTitle");
    const techEl = document.getElementById("projectTechnology");
    const featuredBadgeEl = document.getElementById("projectFeaturedBadge");
    const overviewEl = document.getElementById("projectOverview");
    const liveBtnEl = document.getElementById("projectLiveUrl");

    if (!selectedProject) {
        titleEl.innerText = "Project Not Specified";
        techEl.innerText = "Info";
        overviewEl.innerText = "Please select a project from the Projects section to view its details.";
        return;
    }

    try {
        const response = await fetch(SHEET_API);
        const data = await response.json();
        const validProjects = Array.isArray(data)
            ? data.filter(p => (p.ProjectName || "").trim() !== "")
            : [];

        const projectIndex = validProjects.findIndex(
            p => (p.ProjectName || "").trim().toLowerCase() === selectedProject.toLowerCase()
        );

        const project = projectIndex !== -1 ? validProjects[projectIndex] : null;

        if (project) {
            const name = (project.ProjectName || "Project Details").trim();
            const tech = (project.Technology || "Automation").trim();
            const overview = (project["Project Overview"] || "").trim() || "No project overview available yet.";
            const liveUrl = (project.ProjectURL || "").trim();
            const featured = isFeaturedProject(project);

            document.title = `${name} | HS Automation Solutions`;
            titleEl.innerText = name;
            techEl.innerText = tech;
            featuredBadgeEl.style.display = featured ? "inline-flex" : "none";
            overviewEl.innerText = overview;

            if (liveUrl) {
                liveBtnEl.href = liveUrl;
                liveBtnEl.style.display = "inline-flex";
            }

            renderGallery(extractProjectImages(project), name);
            renderCaseStudySections(project, overview);
            renderPrevNextNav(validProjects, projectIndex);
        } else {
            titleEl.innerText = "Project Not Found";
            techEl.innerText = "Not Found";
            overviewEl.innerText = `Could not find details for "${selectedProject}".`;
        }
    } catch (err) {
        titleEl.innerText = "Error Loading Project";
        techEl.innerText = "Error";
        overviewEl.innerText = "Unable to load project details right now. Please try again later.";
        console.error(err);
    }
}

function toggleLineSpacing() {
    document.getElementById("projectOverview").classList.toggle("compact");
}

function copyShareLink() {
    navigator.clipboard.writeText(window.location.href).then(() => {
        const btn = document.getElementById("copyLinkBtn");
        const original = btn.innerText;
        btn.innerText = "Link Copied ✓";
        setTimeout(() => { btn.innerText = original; }, 1800);
    });
}

loadProject();
</script>

</body>
</html>
